[project]
name = "RAG_against_the_machine"
version = "0.1.0"
description = "RAG against the machine 42 project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "fire>=0.5.0",
    "pydantic>=2.0.0",
    "accelerate>=0.20.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"